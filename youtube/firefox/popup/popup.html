<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Van TV</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="quality-selector.css">
  <link rel="stylesheet" href="playback-messages.css">
</head>
<body>
  <header>
    <h1>Van TV</h1>
    <p id="state" role="status">Connecting…</p>
  </header>
  <a id="video" class="video-title" title="Open on YouTube"></a>
  <a id="channel" class="channel" title="Open the channel on YouTube" hidden>
    <img id="channel-avatar" alt="" width="36" height="36">
    <span class="channel-text">
      <span class="channel-name"><span id="channel-name"></span><svg id="channel-verified" viewBox="0 0 24 24"
        role="img" aria-label="Verified" hidden><circle cx="12" cy="12" r="10"/><path d="m7.5 12.2 3 3 6-6.4"/></svg></span>
      <span id="channel-subscribers"></span>
    </span>
  </a>
  <div class="scrubber">
    <input id="scrub" type="range" min="0" max="0" step="1"
      value="0" aria-label="Playback position" disabled>
    <div class="timeline-labels">
      <span id="elapsed">—</span>
      <button id="duration" type="button" title="Show remaining time"
        aria-label="Show remaining time" aria-pressed="false" disabled>—</button>
    </div>
  </div>
  <div class="transport" role="group" aria-label="Playback controls">
    <button id="previous" class="icon-button" type="button" title="Previous video" aria-label="Previous video" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14m14-14L8 12l11 7Z"/></svg>
    </button>
    <button id="back-twenty" class="icon-button skip" type="button" title="Back 20 seconds" aria-label="Back 20 seconds" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 6M4 4v5h5"/></svg><span aria-hidden="true">20</span>
    </button>
    <button id="toggle" class="icon-button primary" type="button" title="Play" aria-label="Play" disabled>
      <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg>
      <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button id="forward-twenty" class="icon-button skip" type="button" title="Forward 20 seconds" aria-label="Forward 20 seconds" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9a8 8 0 1 0 0 6m0-11v5h-5"/></svg><span aria-hidden="true">20</span>
    </button>
    <button id="next" class="icon-button" type="button" title="Next video" aria-label="Next video" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg>
    </button>
  </div>
  <div class="secondary-controls" role="group" aria-label="More playback controls">
    <button id="stop" class="icon-button" type="button" title="Stop casting" aria-label="Stop casting" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button id="subtitles" class="icon-button" type="button" title="Turn subtitles on"
      aria-label="Subtitles" aria-pressed="false" aria-describedby="subtitle-status" disabled>CC</button>
    <span id="subtitle-status" class="visually-hidden" role="status"></span>
    <div class="quality-setting">
      <label for="quality">Quality</label>
      <select id="quality" title="Maximum resolution; changing quality reloads at the current position" aria-describedby="quality-status" disabled>
        <option value="">Unavailable</option>
      </select>
      <output id="quality-status" aria-live="polite"></output>
      <button id="quality-retry" class="setting-reset" type="button" hidden>Retry</button>
    </div>
  </div>
  <div class="setting" role="group" aria-label="Volume">
    <span>Volume</span>
    <button id="volume-down" class="icon-button" type="button" title="Volume down 5" aria-label="Volume down" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
    <output id="volume-value" aria-live="polite">—</output>
    <button id="volume-up" class="icon-button" type="button" title="Volume up 5" aria-label="Volume up" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
    </button>
    <button id="mute" class="setting-reset" type="button" title="Mute Van TV" aria-pressed="false" disabled>Mute</button>
  </div>
  <div class="setting" role="group" aria-label="Playback speed">
    <span>Speed</span>
    <button id="speed-down" class="icon-button" type="button" title="Slower by 0.25×" aria-label="Slower" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
    <output id="speed-value" aria-live="polite">—</output>
    <button id="speed-up" class="icon-button" type="button" title="Faster by 0.25×" aria-label="Faster" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
    </button>
    <button id="speed-reset" class="setting-reset" type="button" title="Back to normal speed" disabled>1×</button>
  </div>
  <div class="setting" role="group" aria-label="A/V offset">
    <span>A/V offset</span>
    <button id="sound-earlier" class="icon-button" type="button"
      title="Sound earlier (−50 ms): use when voices come after lips move" aria-label="Sound earlier" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
    <output id="audio-delay-value" aria-live="polite">—</output>
    <button id="sound-later" class="icon-button" type="button"
      title="Sound later (+50 ms): use when voices come before lips move" aria-label="Sound later" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
    </button>
    <button id="reset-delay" class="setting-reset" type="button" title="Reset the A/V offset to 0 ms" disabled>Reset</button>
  </div>
  <section id="queue-section" aria-labelledby="queue-heading" hidden>
    <div class="queue-header">
      <h2 id="queue-heading">Queue</h2>
      <span class="queue-actions">
        <button id="queue-end" type="button" title="Scroll to the last video in the queue">Jump to end</button>
        <button id="queue-clear" type="button" title="Remove every played and upcoming video; the current one keeps playing">Clear</button>
      </span>
    </div>
    <ol id="queue"></ol>
  </section>
  <footer>
    <button id="cast-tab" type="button" title="Cast this tab" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h18v14h-8M3 12a7 7 0 0 1 7 7m-7-3a3 3 0 0 1 3 3"/><circle cx="3" cy="19" r=".7"/></svg>
      Cast this tab
    </button>
    <button id="queue-tab" type="button" title="Add this tab's video to the end of the Van TV queue" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h7m6-3v6m-3-3h6"/></svg>
      Queue this tab
    </button>
  </footer>
  <p id="notice" role="status"></p>
  <p id="history-notice" role="status"></p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
